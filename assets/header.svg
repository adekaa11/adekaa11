<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Адильжан Кадыргажы">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1464"/>
      <stop offset="0.55" stop-color="#2b3a8f"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7f9ec"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="clip"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .b1 { animation: d1 11s ease-in-out infinite; }
    .b2 { animation: d2 13s ease-in-out infinite; }
    .b3 { animation: d3 9s ease-in-out infinite; }
    @keyframes d1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(90px,30px); } }
    @keyframes d2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-110px,-25px); } }
    @keyframes d3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-30px); } }
    .w1 { animation: wave 14s linear infinite; }
    .w2 { animation: wave 9s linear infinite reverse; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    .tw { animation: tw 3.4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .name { opacity: 0; animation: rise 1.2s ease-out .2s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .tag { opacity: 0; animation: cyc 9s ease-in-out infinite both; }
    .t2 { animation-delay: 3s; }
    .t3 { animation-delay: 6s; }
    @keyframes cyc { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: translateY(0); } 30% { opacity: 1; transform: translateY(0); } 36% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="190" cy="70" r="75" fill="#ff8a4c" opacity=".75"/>
      <circle class="b2" cx="720" cy="190" r="90" fill="#ff5fa2" opacity=".6"/>
      <circle class="b3" cx="470" cy="40" r="55" fill="#3ee6c4" opacity=".6"/>
    </g>
    <g fill="#fff">
      <circle class="tw" cx="70" cy="40" r="2"/>
      <circle class="tw" cx="150" cy="150" r="1.6" style="animation-delay:.8s"/>
      <circle class="tw" cx="330" cy="30" r="2" style="animation-delay:1.6s"/>
      <circle class="tw" cx="610" cy="60" r="1.8" style="animation-delay:.4s"/>
      <circle class="tw" cx="800" cy="35" r="2.2" style="animation-delay:2.2s"/>
      <circle class="tw" cx="850" cy="130" r="1.6" style="animation-delay:1.2s"/>
      <circle class="tw" cx="520" cy="150" r="1.4" style="animation-delay:2.8s"/>
    </g>
    <text class="name" x="450" y="130" text-anchor="middle" font-size="56" font-weight="700" fill="url(#ink)">Адильжан Кадыргажы</text>
    <g font-size="24" fill="#e0e7ff" text-anchor="middle">
      <text class="tag" x="450" y="178">строю AI-сервисы на Python</text>
      <text class="tag t2" x="450" y="178">учу computer vision</text>
      <text class="tag t3" x="450" y="178">делаю Telegram-ботов</text>
    </g>
    <text x="450" y="212" text-anchor="middle" font-size="15" fill="#c7d2fe" opacity=".75" letter-spacing="3">АСТАНА · КАЗАХСТАН</text>
    <g class="w1" fill="#ffffff" opacity=".07">
      <path d="M0 232 Q112 204 225 232 T450 232 T675 232 T900 232 T1125 232 T1350 232 T1575 232 T1800 232 V280 H0 Z"/>
    </g>
    <g class="w2" fill="#ffffff" opacity=".1">
      <path d="M0 248 Q112 224 225 248 T450 248 T675 248 T900 248 T1125 248 T1350 248 T1575 248 T1800 248 V280 H0 Z"/>
    </g>
  </g>
</svg>
