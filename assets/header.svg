<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Adilzhan Kadyrgazhy">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1c2540"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6d28d9" stop-opacity=".35"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <clipPath id="clip"><rect width="900" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .p { stroke-width: 2; stroke-linecap: round; stroke-dasharray: 9 100; stroke-dashoffset: 9; animation: flow 3.2s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 9; } to { stroke-dashoffset: -100; } }
    .halo { animation: halo 2.4s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: .08; } 50% { opacity: .35; } }
    .in { opacity: 0; animation: rise .9s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .tag { opacity: 0; animation: cyc 9s ease-in-out infinite both; }
    .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; }
    @keyframes cyc { 0% { opacity: 0; } 5% { opacity: 1; } 31% { opacity: 1; } 36% { opacity: 0; } 100% { opacity: 0; } }
  </style>
